<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Local Remote</title>
    <meta name="theme-color" content="#253f91">

    <link rel="stylesheet" href="/style.css">
    <link rel="manifest" href="/site.webmanifest">

    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="shortcut icon" href="/favicon.ico">

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Local Remote">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  </head>
  <body>
    <main class="remote" aria-label="Local Remote">

      <header class="remote-header">
      </header>

      <section class="touch-area" aria-label="Touch Area">
        <span class="touch-chevron touch-chevron--up" aria-hidden="true"></span>
        <span class="touch-chevron touch-chevron--right" aria-hidden="true"></span>
        <span class="touch-chevron touch-chevron--down" aria-hidden="true"></span>
        <span class="touch-chevron touch-chevron--left" aria-hidden="true"></span>
      </section>

      <nav class="controls" aria-label="remote controls">
        <button type="button" data-action="volume-down" aria-label="quieter">
          <svg class="control-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 10v4h4l5 4V6l-5 4H4z"></path>
            <path d="M16 9.5a4 4 0 0 1 0 5"></path>
          </svg>
        </button>
        <button type="button" data-action="volume-up" aria-label="louder">
          <svg class="control-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 10v4h4l5 4V6l-5 4H4z"></path>
            <path d="M16 9.5a4 4 0 0 1 0 5M18.5 7a7.5 7.5 0 0 1 0 10"></path>
          </svg>
        </button>
      </nav>

      <form class="text-entry" aria-label="Textinput">
        <input
          type="text"
          maxlength="500"
          autocomplete="off"
          enterkeyhint="send"
          placeholder="Enter text"
          aria-label="Text for PC"
        >
      </form>

      <output class="feedback" aria-live="polite"></output>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
